# Everything (web client, fteqw-server, ftemaster WebRTC broker) runs in this
# one container. Every setting below is documented in .env.example.
services:
  cloudyquake:
    # Pulled from the registry by default; `docker compose up --build` (or
    # `docker compose build`) builds it locally from this repo instead.
    image: ghcr.io/benmclean/cloudyquake:latest
    build: .
    container_name: cloudyquake
    environment:
      # linuxserver.io-style: the container's services run as this uid/gid
      # so they can read your /paks directory.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      GAME: ${GAME:-qw}
      WS_URL: ${WS_URL:-}
      SV_HOST: ${SV_HOST:-}
      PASSWORD: ${PASSWORD:-}
      USE_LOGIN_NAME: ${USE_LOGIN_NAME:-true}
      BASE_GAMEDIR: ${BASE_GAMEDIR:-id1}
      GAMEDIRS: ${GAMEDIRS:-}
      CLIENT_ARGS: ${CLIENT_ARGS:-}
      SERVER_ARGS: ${SERVER_ARGS:-}
      SV_PORT: ${SV_PORT:-27500}
      SV_PORT_TCP: ${SV_PORT_TCP:-27500}
      NET_ICE_NAME: ${NET_ICE_NAME:-/cloudyquake}
      NET_ICE_BROKER: ${NET_ICE_BROKER:-}
      FTEMASTER_PORT: ${FTEMASTER_PORT:-27950}
      FTEMASTER_HOST: ${FTEMASTER_HOST:-}
    volumes:
      - ${CONFIG_DIR:-./config}:/config
      - ${PAK_DIR:-./paks}:/paks:ro
    ports:
      - "${WEB_HTTP_PORT:-27501}:8080"
      - "${SV_PORT:-27500}:${SV_PORT:-27500}/udp"
      - "${SV_PORT_TCP:-27500}:${SV_PORT_TCP:-27500}/tcp"
      - "${FTEMASTER_PORT:-27950}:${FTEMASTER_PORT:-27950}/tcp"
      - "${FTEMASTER_PORT:-27950}:${FTEMASTER_PORT:-27950}/udp"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
