x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${WEB_HTTP_PORT:-8080}:8080"
    environment:
      WS_URL: ${WS_URL:?Set WS_URL to the externally-reachable websocket URL, e.g. wss://quakeworld.example.com}
      # Shared password, gating both the web login (and pak downloads) and
      # joining the match itself - see nginx/auth.js and
      # fteqw-server/docker-entrypoint.sh. Optional - leave blank in .env
      # for a public server with nothing to gate.
      PASSWORD: ${PASSWORD:-}
      # Set to "false" to skip using the login username as the in-game
      # player name (falls back to fteqw's own default player name
      # instead). Combined with a blank PASSWORD above, this skips the
      # login prompt entirely - see nginx/auth.js.
      USE_LOGIN_NAME: ${USE_LOGIN_NAME:-true}
      # Which extra gamedirs (mission packs, mods, map packs) to serve to
      # browsers, alongside the always-present id1/ - space-separated, see
      # PAK_DIR below and GAMEDIRS on fteqw-server. Must match between the
      # two services, so it's set once here from the same .env var. Blank
      # means base game only.
      GAMEDIRS: ${GAMEDIRS:-}
      # Raw, space-separated fteqw client command line switches/cvars,
      # passed through as-is - the client-side counterpart to
      # fteqw-server's own SERVER_ARGS below, named distinctly so it's
      # unambiguous which side of the connection each one reaches.
      CLIENT_ARGS: ${CLIENT_ARGS:-}
      # Which PAK_DIR subfolder is always served, alongside GAMEDIRS - see
      # PAK_DIR below and BASE_GAMEDIR on fteqw-server, whose own
      # docker-entrypoint.sh explains why this is purely a pak-volume
      # convention, unrelated to which fteqw flags are actually in play.
      # Must match between the two services, so it's set once here from
      # the same .env var, same as GAMEDIRS.
      BASE_GAMEDIR: ${BASE_GAMEDIR:-id1}
      # Only used here to build config.json's human-facing nativeClientCmd -
      # nginx never talks raw UDP/WS to fteqw-server itself.
      SV_PORT: ${SV_PORT:-27500}
    # Runs as nginx's own built-in user (101:101) by default - matches what
    # nginx.conf's lack of a "user" directive already implies. Override
    # with PUID/PGID if your PAK_DIR is owned by a specific uid/gid on the
    # host, e.g. PUID=1001 PGID=1001 in .env - same convention as the
    # linuxserver.io images.
    user: "${PUID:-101}:${PGID:-101}"
    volumes:
      # PAK_DIR's own subfolders (id1/, hipnotic/, rogue/, a mod's own
      # folder, ...) become the gamedirs nginx can serve from - see
      # nginx/auth.js's listGameFiles(). Same volume, same layout, as
      # fteqw-server's mount below.
      - ${PAK_DIR:-./paks}:/paks:ro
    restart: unless-stopped
    logging: *default-logging

  fteqw-server:
    build:
      context: ./fteqw-server
    ports:
      - "${SV_PORT:-27500}:${SV_PORT:-27500}/udp"
      - "${SV_PORT_TCP:-27500}:${SV_PORT_TCP:-27500}/tcp"
    environment:
      SV_PORT: ${SV_PORT:-27500}
      SV_PORT_TCP: ${SV_PORT_TCP:-27500}
      # Same shared secret as nginx's PASSWORD above - this is what
      # actually gates joining the game itself (HTTP Basic Auth can't reach
      # the WebSocket handshake - see nginx/auth.js's file-level comment).
      PASSWORD: ${PASSWORD:-}
      # Extra gamedirs (mission packs, mods, map packs) to stack on top of
      # the base game, space-separated, via additional "-game" flags in
      # order - see PAK_DIR below and docker-entrypoint.sh. Blank means
      # base gamedir only (see BASE_GAMEDIR below).
      GAMEDIRS: ${GAMEDIRS:-}
      # Which PAK_DIR subfolder is fteqw's implicit default/always-loaded
      # gamedir - "id1" (default) for stock Quake/QuakeWorld, or e.g.
      # "data1" if SERVER_ARGS below points at a different game whose own
      # retail layout calls it something else. See docker-entrypoint.sh.
      BASE_GAMEDIR: ${BASE_GAMEDIR:-id1}
      # Raw, space-separated fteqw startup switches/cvars, passed through
      # as-is - hostname, map, deathmatch, maxclients, sv_public, etc. all
      # belong here, not as their own vars - see docker-entrypoint.sh for
      # why. "-game qw" is always baked in, not part of this.
      SERVER_ARGS: ${SERVER_ARGS:-}
    volumes:
      # The dedicated server is authoritative - unlike CloudyDoom's
      # chocolate-server, which never touches the WAD at all, fteqw-server
      # actually loads maps/models/sounds from these pak files to run the
      # game, so this volume is mounted here too, not just into nginx.
      #
      # PAK_DIR's own layout mirrors Quake's usual install layout - one
      # subfolder per gamedir (id1/, hipnotic/, rogue/, a mod's own name),
      # e.g. PAK_DIR/id1/pak0.pak, PAK_DIR/hipnotic/pak0.pak. Mounted at
      # /fte-data (not directly at /fte/id1) because fteqw-server also
      # ships its own baked-in qw/ (compiled gamecode, see Dockerfile) that
      # a wholesale bind-mount over /fte would hide entirely - the
      # entrypoint instead symlinks each subfolder found here into /fte/,
      # which merges the two without either clobbering the other (a
      # PAK_DIR/qw/ folder of your own, e.g. from a full retail install,
      # still takes priority over the baked-in one - see
      # docker-entrypoint.sh).
      - ${PAK_DIR:-./paks}:/fte-data:ro
    restart: unless-stopped
    logging: *default-logging
