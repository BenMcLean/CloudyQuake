# Dynamic module providing js_content/js_import, used below for auth.js -
# any username is accepted as long as the password matches PASSWORD (see
# nginx/auth.js). Installed via "apk add nginx-mod-http-js" in the
# Dockerfile.
load_module modules/ngx_http_js_module.so;

user abc;
worker_processes auto;
pid /run/cloudyquake/nginx.pid;

# Logging directly to the stdout/stderr device paths, not the base image's
# default /var/log/nginx/*.log (which are themselves just symlinks to these
# same devices). That indirection breaks when nginx runs as a custom
# PUID/PGID: re-opening /proc/self/fd/N through the symlink hits a
# permission check that using the device path directly doesn't.
error_log /dev/stderr warn;

# nginx clears the environment for worker processes by default; auth.js
# reads these directly via process.env. PASSWORD never leaves nginx except
# as a value embedded in /config.json for the already-authenticated client
# (see auth.js's config()); USE_LOGIN_NAME is nginx-only.
env PASSWORD;
env USE_LOGIN_NAME;
env GAMEDIRS;
env BASE_GAMEDIR;

events {
    worker_connections 1024;
}

http {
    js_path "/etc/nginx/njs/";
    js_import auth from auth.js;

    # Only log failures (4xx/5xx, e.g. bad logins) - successful requests
    # (every page load, config.json fetch and pak range request) would
    # otherwise drown out the game server's own log lines.
    map $status $loggable {
        ~^[23]  0;
        default 1;
    }
    access_log /dev/stdout combined if=$loggable;

    # nginx:1.27's bundled mime.types already maps .wasm -> application/wasm.
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/css application/javascript application/wasm application/octet-stream;

    # index.html and app.js change with every redeploy and are tiny, so
    # make browsers revalidate them (cheap 304s) - otherwise a heuristic
    # cache lifetime based on Last-Modified can leave a stale copy running
    # against a new config.json, a confusing failure. Deliberately NOT
    # applied to anything else served here (ftewebgl.js/.wasm, and
    # /paks/ is a separate location entirely): those are large, and
    # game data in particular will only get bigger with other engines.
    # An empty add_header value is omitted, so everything else keeps
    # nginx's default caching behavior.
    map $uri $site_cache_control {
        default      "";
        /            "no-cache";
        /index.html  "no-cache";
        /app.js      "no-cache";
    }

    server {
        listen 8080;

        root /usr/share/nginx/html;

        # auth.js accepts any username (used as the in-game player name -
        # see config.json below) as long as the password matches
        # PASSWORD. Every location is gated through it before falling
        # through to an "@..." internal location that does the real work,
        # since nginx has no auth module that can check a header field
        # without knowing the username in advance.

        # config.json is regenerated per-request (not just per-container-
        # start) so it can embed the requesting client's own player name -
        # see auth.js's config() and init-cloudyquake-config's
        # config.base.json. Never let it be cached by the browser.
        location = /config.json {
            js_content auth.config;
        }

        # pak0.pak/pak1.pak (and anything else you drop in) live on a
        # mounted volume, separate from the baked-in site assets, so
        # swapping retail data never touches the image - see PAK_DIR in
        # docker-compose.yml.
        location /paks/ {
            js_content auth.servePaks;
        }

        location @paks {
            internal;
            # alias isn't allowed in a named location, but the URI prefix
            # ("/paks/...") already matches the mount point's path, so
            # rooting at "/" and letting the URI resolve naturally serves
            # the same files an "alias /paks/;" would have.
            root /;
            try_files $uri =404;
        }

        # Served without auth, unlike everything else under location / -
        # Chrome (and others) fetch a page's favicon in the background
        # without attaching cached HTTP Basic Auth credentials, and won't
        # show the auth prompt for it either, so gating it the same way as
        # the rest of the site just makes it silently fail to load with no
        # visible request/error at all. It's just an icon, nothing
        # sensitive, so there's no real reason to gate it anyway.
        location = /favicon.ico {
            try_files /favicon.ico =404;
        }

        location / {
            js_content auth.serve;
        }

        location @content {
            internal;
            # Only the page shell is revalidated on every load (see the
            # map above) - never the big engine/game assets.
            add_header Cache-Control $site_cache_control;
            try_files $uri $uri/ =404;
        }
    }
}
