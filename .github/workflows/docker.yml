name: Build and publish image

# Publishes ghcr.io/benmclean/cloudyquake:
#   - every push to master: a linux/amd64-only build, tagged "edge".
#   - every tag matching v* (e.g. v2026-10-01): a release build for linux/amd64
#     AND linux/arm64, tagged with the tag itself and "latest".
#
# Each architecture is built on a native runner (no QEMU - the fteqw/yquake2
# compiles are slow enough already), then merged into one manifest list. The
# wasm browser client is architecture-independent (and its emsdk image is
# amd64-only), so it's built once on amd64 in its own job and passed to every
# platform build as a named build context.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Must be lowercase (the GitHub owner is BenMcLean).
  IMAGE: ghcr.io/benmclean/cloudyquake
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the web client
        uses: docker/build-push-action@v6
        with:
          context: .
          target: wasm
          outputs: type=local,dest=wasm-out
          cache-from: type=gha,scope=wasm
          cache-to: type=gha,mode=max,scope=wasm

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: wasm-out/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        # arm64 only for release tags.
        include: >-
          ${{ fromJSON(startsWith(github.ref, 'refs/tags/v')
          && '[{"platform":"linux/amd64","runner":"ubuntu-24.04"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
          || '[{"platform":"linux/amd64","runner":"ubuntu-24.04"}]') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: wasm-out

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-contexts: wasm=./wasm-out
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # master: "edge". v* tag: the tag as written (v2026-10-01) plus "latest".
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ env.IS_RELEASE != 'true' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ env.IS_RELEASE == 'true' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # intentional word splitting
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
