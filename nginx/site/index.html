<!DOCTYPE html>
<html lang="en-us">
    <head>
        <title>CloudyQuake</title>
        <style>
            * {
                box-sizing: border-box;
            }

            html, body {
                height: 100%;
            }

            body {
                background-color: #111;
                color: #ccc;
                margin: 0;
                padding: 0;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family: monospace;
            }

            #container {
                position: relative;
                width: 100vw;
                height: 100vh;
                margin: auto;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
            canvas.frame {
                background-color: black;
                width: 100vw;
                height: 100vh;
            }

            /* overlay, not laid out in the flow, so a long/wrapped message
               can never get clipped by the canvas's size budget or body's
               overflow:hidden */
            #status {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0.5em;
                max-width: 100vw;
                padding: 0 1ch;
                font-size: 1.4em;
                text-align: center;
                min-height: 1.4em;
                text-shadow: 0 0 4px #000, 0 0 4px #000;
            }
        </style>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
    </head>
    <body>
        <div id="container">
            <canvas class="frame" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
            <div id="status">Loading configuration&hellip;</div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
